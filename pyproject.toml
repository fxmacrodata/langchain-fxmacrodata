[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-fxmacrodata"
version = "0.1.1"
description = "LangChain and LangGraph tools for the public FXMacroData API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["langchain-core==1.7.3"]

[project.optional-dependencies]
langgraph = ["langgraph==1.2.19"]

[project.urls]
Documentation = "https://fxmacrodata.com/docs?utm_source=pypi&utm_medium=referral&utm_campaign=langchain-fxmacrodata&utm_content=package"

Source = "https://github.com/fxmacrodata/langchain-fxmacrodata?utm_source=pypi&utm_medium=referral&utm_campaign=langchain-fxmacrodata&utm_content=repository-code"
Issues = "https://github.com/fxmacrodata/langchain-fxmacrodata/issues?utm_source=pypi&utm_medium=referral&utm_campaign=langchain-fxmacrodata&utm_content=issues"

[tool.setuptools]
packages = ["langchain_fxmacrodata"]
include-package-data = false
